<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth" data-theme="teal-coral">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover">
    <title>Join PawCare · Client Portal Registration</title>

    <!-- Favicon suite (paw icon) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='22' r='6' fill='%230d9488'/%3E%3Ccircle cx='8' cy='14' r='4' fill='%230d9488'/%3E%3Ccircle cx='24' cy='14' r='4' fill='%230d9488'/%3E%3Ccircle cx='12' cy='8' r='3.5' fill='%230d9488'/%3E%3Ccircle cx='20' cy='8' r='3.5' fill='%230d9488'/%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='22' r='6' fill='%230d9488'/%3E%3Ccircle cx='8' cy='14' r='4' fill='%230d9488'/%3E%3Ccircle cx='24' cy='14' r='4' fill='%230d9488'/%3E%3Ccircle cx='12' cy='8' r='3.5' fill='%230d9488'/%3E%3Ccircle cx='20' cy='8' r='3.5' fill='%230d9488'/%3E%3C/svg%3E" />

    <!-- Tailwind CSS -->
    <script src="tailwind.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'teal-brand': 'var(--color-primary)',
                        'teal-light': 'var(--color-primary-light)',
                        'teal-dark': 'var(--color-primary-dark)',
                        'teal-bright': 'var(--color-primary-bright)',
                        'coral-accent': 'var(--color-accent)',
                        'bg-sand': 'var(--color-bg-warm)',
                        'ink-charcoal': 'var(--color-text-dark)',
                        'dark-bg': '#1a1f2e',
                        'dark-card': '#232a3d',
                        'dark-surface': '#2d3548',
                    },
                    fontFamily: {
                        'sans': ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        'display': ['Quicksand', 'sans-serif'],
                        'body': ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out',
                        'float-slow': 'floatSlow 6s ease-in-out infinite',
                        'slide-up': 'slideUp 0.5s ease-out',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(12px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        floatSlow: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-6px)' } },
                        slideUp: { '0%': { transform: 'translateY(30px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                    }
                }
            }
        }
    </script>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        :root, [data-theme="teal-coral"] {
            --color-primary: #0d9488;
            --color-primary-light: #99f6e4;
            --color-primary-dark: #0f766e;
            --color-primary-bright: #2dd4bf;
            --color-accent: #ff5a36;
            --color-bg-warm: #fefdfb;
            --color-text-dark: #343a45;
            --color-rgb-primary: 13, 148, 136;
            --color-rgb-bright: 45, 212, 191;
            --color-rgb-coral: 255, 90, 54;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--color-bg-warm);
            color: var(--color-text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            font-family: 'Inter', system-ui, sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .dark body {
            background-color: #1a1f2e;
            color: #eceef2;
        }

        .dark .text-ink-charcoal { color: #eceef2; }
        .dark input, .dark select, .dark textarea { color: #FFFFFF !important; }

        .teal-gradient-text {
            background: linear-gradient(135deg, #5eead4 0%, #14b8a6 50%, #0f766e 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Theme toggles — top-right */
        .theme-toggle-wrapper {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            display: flex;
            gap: 8px;
        }

        [dir="rtl"] .theme-toggle-wrapper {
            right: auto;
            left: 16px;
        }

        .toggle-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(13, 148, 136, 0.1);
            color: #0d9488;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: bold;
        }

        .dark .toggle-btn {
            background: rgba(45, 212, 191, 0.15);
            color: #2dd4bf;
        }

        .toggle-btn:hover {
            transform: scale(1.1);
            background: rgba(13, 148, 136, 0.2);
            color: #0d9488;
        }

        .dark .toggle-btn:hover {
            transform: scale(1.1);
            background: rgba(45, 212, 191, 0.25);
            color: #2dd4bf;
        }

        /* Signup Card */
        .signup-card {
            background: #FFFFFF;
            border-radius: 32px;
            padding: 1.8rem 2rem 1.8rem;
            box-shadow: 0 25px 50px rgba(var(--color-rgb-primary), 0.10);
            border: 1px solid rgba(var(--color-rgb-primary), 0.15);
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .dark .signup-card {
            background: #232a3d;
            border-color: rgba(var(--color-rgb-bright), 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        /* Input styling */
        .signup-input {
            width: 100%;
            padding: 0.8rem 1.2rem 0.8rem 3rem;
            border-radius: 16px;
            border: 1.5px solid rgba(var(--color-rgb-primary), 0.15);
            background: #FFFFFF;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            color: var(--color-text-dark);
            font-family: 'Inter', sans-serif;
        }

        .dark .signup-input {
            background: #1a1f2e;
            border-color: rgba(var(--color-rgb-bright), 0.2);
            color: #eceef2;
        }

        .signup-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(var(--color-rgb-primary), 0.15);
        }

        .dark .signup-input:focus {
            border-color: var(--color-primary-bright);
            box-shadow: 0 0 0 4px rgba(var(--color-rgb-bright), 0.12);
        }

        .signup-input::placeholder {
            color: rgba(52, 58, 69, 0.4);
        }
        .dark .signup-input::placeholder {
            color: rgba(236, 238, 242, 0.3);
        }

        /* Password wrapper */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper .signup-input {
            padding-right: 3rem;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--color-primary);
            font-size: 0.95rem;
            transition: color 0.2s;
            background: transparent;
            border: none;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dark .toggle-password {
            color: var(--color-primary-bright);
        }

        .toggle-password:hover {
            color: var(--color-primary-dark);
        }

        [dir="rtl"] .toggle-password {
            right: auto;
            left: 1rem;
        }

        [dir="rtl"] .password-wrapper .signup-input {
            padding-right: 1.2rem;
            padding-left: 3rem;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }

        /* Primary button */
        .btn-teal {
            background: var(--color-primary);
            color: #FFFFFF;
            font-weight: 700;
            padding: 0.8rem 1.5rem;
            border-radius: 9999px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            box-shadow: 0 4px 15px rgba(var(--color-rgb-primary), 0.3);
            letter-spacing: 0.3px;
        }

        .dark .btn-teal {
            background: var(--color-primary-bright);
            color: #1a1f2e;
            box-shadow: 0 4px 15px rgba(var(--color-rgb-bright), 0.3);
        }

        .btn-teal:hover {
            transform: translateY(-2px);
            background: var(--color-primary-dark);
            color: #FFFFFF;
            box-shadow: 0 10px 25px rgba(var(--color-rgb-primary), 0.4);
        }

        .dark .btn-teal:hover {
            background: var(--color-primary);
            color: #FFFFFF;
            box-shadow: 0 10px 25px rgba(var(--color-rgb-bright), 0.4);
        }

        /* Social signup buttons */
        .social-btn {
            flex: 1;
            padding: 0.7rem 0.5rem;
            border-radius: 9999px;
            border: 1.5px solid rgba(var(--color-rgb-primary), 0.15);
            background: #FFFFFF;
            color: var(--color-text-dark);
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            gap: 0.5rem;
            white-space: nowrap;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
        }

        .dark .social-btn {
            background: #1a1f2e;
            border-color: rgba(var(--color-rgb-bright), 0.2);
            color: #eceef2;
        }

        .social-btn:hover {
            background: var(--color-bg-warm);
            border-color: var(--color-primary);
            transform: translateY(-2px);
        }

        .dark .social-btn:hover {
            background: rgba(var(--color-rgb-bright), 0.08);
            border-color: var(--color-primary-bright);
        }

        .social-btn i {
            font-size: 1.1rem;
            color: var(--color-primary);
        }

        .dark .social-btn i {
            color: var(--color-primary-bright);
        }

        /* Logo container */
        .logo-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .brand-logo {
            background: var(--color-primary);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(var(--color-rgb-primary), 0.25);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .brand-logo:hover {
            transform: scale(1.05);
        }

        .dark .brand-logo {
            background: var(--color-primary-bright);
        }

        .brand-logo svg {
            width: 26px;
            height: 26px;
        }

        .welcome-title {
            font-family: 'Quicksand', sans-serif;
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--color-text-dark);
            margin-top: 1.25rem;
            margin-bottom: 0.1rem;
            text-align: center;
            line-height: 1.2;
        }

        .dark .welcome-title {
            color: #eceef2;
        }

        .welcome-subtitle {
            font-size: 0.85rem;
            color: var(--color-text-dark);
            text-align: center;
            margin-bottom: 0.25rem;
            font-weight: 400;
            opacity: 0.7;
        }

        .dark .welcome-subtitle {
            color: #eceef2;
        }

        /* Terms text */
        .terms-text {
            font-size: 0.7rem;
            color: var(--color-text-dark);
        }

        .dark .terms-text {
            color: #9CA3AF;
        }

        .terms-link {
            color: var(--color-primary);
            font-weight: 600;
            text-decoration: none;
        }

        .dark .terms-link {
            color: var(--color-primary-bright);
        }

        .terms-link:hover {
            text-decoration: underline;
            color: var(--color-primary-dark);
        }

        .dark .terms-link:hover {
            color: var(--color-primary-light);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1rem 0 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(var(--color-rgb-primary), 0.15);
        }

        .dark .divider::before,
        .dark .divider::after {
            border-bottom-color: rgba(var(--color-rgb-bright), 0.2);
        }

        .divider span {
            font-size: 0.7rem;
            padding: 0 0.8rem;
            color: var(--color-text-dark);
            font-weight: 600;
            opacity: 0.6;
        }

        .dark .divider span {
            color: #9CA3AF;
        }

        .custom-checkbox {
            accent-color: var(--color-primary);
        }

        .dark .custom-checkbox {
            accent-color: var(--color-primary-bright);
        }

        a {
            transition: all 0.2s ease;
        }

        /* Background decorative glow */
        .bg-glow {
            position: fixed;
            top: -30%;
            right: -20%;
            width: 60%;
            height: 80%;
            background: radial-gradient(circle, rgba(var(--color-rgb-primary), 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .dark .bg-glow {
            background: radial-gradient(circle, rgba(var(--color-rgb-bright), 0.04) 0%, transparent 70%);
        }

        .bg-glow-left {
            position: fixed;
            bottom: -30%;
            left: -20%;
            width: 60%;
            height: 80%;
            background: radial-gradient(circle, rgba(var(--color-rgb-primary), 0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .dark .bg-glow-left {
            background: radial-gradient(circle, rgba(var(--color-rgb-bright), 0.03) 0%, transparent 70%);
        }

        .container-tight {
            max-width: 480px;
            width: 100%;
            padding: 0 1.5rem;
        }

        /* Floating paw decoration */
        .paw-deco {
            position: fixed;
            opacity: 0.04;
            font-size: 8rem;
            pointer-events: none;
            z-index: 0;
        }
        .dark .paw-deco { opacity: 0.03; }

        /* Responsive */
        @media (max-height: 650px) {
            .signup-card { padding: 0.8rem 1.5rem; transform: scale(0.94); transform-origin: center; }
            .logo-center { margin-bottom: 0.3rem; }
            .welcome-title { font-size: 1.3rem; margin-top: 0.25rem; }
            .welcome-subtitle { font-size: 0.75rem; margin-bottom: 0.15rem; }
            .signup-input { padding: 0.5rem 0.8rem 0.5rem 2.5rem; font-size: 0.8rem; }
            .btn-teal { padding: 0.5rem 1rem; font-size: 0.85rem; }
            .brand-logo { width: 36px; height: 36px; }
            .brand-logo svg { width: 22px; height: 22px; }
            .theme-toggle-wrapper { top: 8px; right: 8px; }
            .toggle-btn { width: 34px; height: 34px; font-size: 0.8rem; }
            .divider { margin: 0.6rem 0; }
            .social-btn { padding: 0.4rem 0.5rem; font-size: 0.75rem; }
        }

        @media (max-width: 380px) {
            .signup-card { padding: 1.2rem 1.2rem; border-radius: 24px; }
            .welcome-title { font-size: 1.3rem; }
            .signup-input { padding: 0.6rem 0.8rem 0.6rem 2.6rem; font-size: 0.8rem; }
            .social-btn { padding: 0.4rem 0.3rem; font-size: 0.75rem; gap: 0.3rem; }
            .social-btn i { font-size: 0.9rem; }
        }

        @media (max-width: 480px) {
            .theme-toggle-wrapper { top: 12px; right: 12px; }
            [dir="rtl"] .theme-toggle-wrapper { left: 12px; right: auto; }
        }
    </style>
</head>

<body>

    <!-- Background Glows -->
    <div class="bg-glow"></div>
    <div class="bg-glow-left"></div>

    <!-- Floating paw decorations -->
    <div class="paw-deco" style="top: 8%; left: 5%;">🐾</div>
    <div class="paw-deco" style="bottom: 6%; right: 6%; font-size: 6rem;">🐾</div>

    <!-- ===== THEME TOGGLES - TOP-RIGHT ===== -->
    <div class="theme-toggle-wrapper">
        <button id="theme-toggle" class="toggle-btn" title="Dark / Light">
          <i class="fas fa-moon dark:hidden text-sm"></i>
          <i class="fas fa-sun hidden dark:inline text-sm"></i>
        </button>
        <button id="rtl-toggle" class="toggle-btn" title="RTL / LTR">
          &#8644;
        </button>
    </div>

    <!-- ===== SIGNUP CARD ===== -->
    <div class="container-tight relative z-10">
        <div class="signup-card animate-fade-in">

            <!-- ===== LOGO - CENTERED ===== -->
            <div class="logo-center">
                <a href="index.html" class="flex items-center gap-3 group shrink-0">
                    <div class="brand-logo" style="background-color: #0d9488 !important;">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
                            <circle cx="18" cy="22" r="5" fill="white" opacity="0.95"/>
                            <circle cx="10" cy="15" r="3.5" fill="white" opacity="0.95"/>
                            <circle cx="26" cy="15" r="3.5" fill="white" opacity="0.95"/>
                            <circle cx="14" cy="9" r="3" fill="white" opacity="0.95"/>
                            <circle cx="22" cy="9" r="3" fill="white" opacity="0.95"/>
                        </svg>
                    </div>
                    <span class="flex flex-col items-start leading-tight">
                        <span class="text-2xl font-display font-bold tracking-tight text-ink-charcoal dark:text-white">PawCare</span>
                        <span class="text-[10px] font-bold tracking-[0.15em] uppercase -mt-0.5" style="color: #ff5a36 !important;">Veterinary Clinic</span>
                    </span>
                </a>

                <h1 class="welcome-title">Create Account</h1>
                <p class="welcome-subtitle">Join our clinic to book visits, track vaccinations &amp; view medical history</p>
            </div>

            <!-- ===== SIGNUP FORM ===== -->
            <form id="signupForm" class="space-y-3.5" action="client.html" method="GET">

                <!-- Full Name -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-teal-brand input-icon">
                        <i class="fas fa-user w-4 text-sm"></i>
                    </span>
                    <input type="text" id="fullName" name="name" placeholder="Full name" required
                        class="signup-input text-sm md:text-sm">
                </div>

                <!-- Email -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-teal-brand input-icon">
                        <i class="fas fa-envelope w-4 text-sm"></i>
                    </span>
                    <input type="email" id="email" name="email" placeholder="Email address" required
                        class="signup-input text-sm md:text-sm">
                </div>

                <!-- Password with eye -->
                <div class="password-wrapper">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-teal-brand input-icon">
                        <i class="fas fa-lock w-4 text-sm"></i>
                    </span>
                    <input type="password" id="signup-password" name="password" placeholder="Password" required
                        class="signup-input text-sm md:text-sm">
                    <button type="button" class="toggle-password" data-target="signup-password"
                        aria-label="Show password">
                        <i class="far fa-eye-slash"></i>
                    </button>
                </div>

                <!-- Confirm Password with eye -->
                <div class="password-wrapper">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-teal-brand input-icon">
                        <i class="fas fa-lock w-4 text-sm"></i>
                    </span>
                    <input type="password" id="signup-confirm-password" name="confirm_password"
                        placeholder="Confirm password" required class="signup-input text-sm md:text-sm">
                    <button type="button" class="toggle-password" data-target="signup-confirm-password"
                        aria-label="Show password">
                        <i class="far fa-eye-slash"></i>
                    </button>
                </div>

                <!-- Terms -->
                <div class="flex items-start space-x-2 rtl:space-x-reverse mt-1">
                    <input type="checkbox" id="terms"
                        class="mt-0.5 rounded border-gray-300 dark:border-gray-600 custom-checkbox"
                        required>
                    <label for="terms" class="terms-text">
                        I agree to the <a href="#" class="terms-link" id="termsLink">Terms of Service</a> and
                        <a href="#" class="terms-link" id="privacyLink">Privacy Policy</a>
                    </label>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-teal mt-1">
                    Create Account <i class="fas fa-user-plus ml-2"></i>
                </button>
            </form>

            <!-- ===== Divider + Social ===== -->
            <div class="divider">
                <span>or sign up with</span>
            </div>

            <div class="flex gap-3">
                <button class="social-btn" id="googleSignupBtn">
                    <i class="fab fa-google"></i>
                    <span>Google</span>
                </button>
                <button class="social-btn" id="appleSignupBtn">
                    <i class="fab fa-apple"></i>
                    <span>Apple</span>
                </button>
            </div>

            <!-- ===== LOGIN LINK ===== -->
            <div class="mt-4 text-center">
                <span class="text-xs text-ink-charcoal/60 dark:text-gray-400">Already a PawCare client?</span>
                <a href="login.html"
                    class="text-xs font-semibold text-teal-brand dark:text-teal-bright ml-1 rtl:mr-1 hover:underline">
                    Sign in
                </a>
            </div>

        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Theme Toggle
            const themeBtn = document.getElementById('theme-toggle');
            function setTheme(isDark) {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                const moon = themeBtn?.querySelector('.fa-moon');
                const sun = themeBtn?.querySelector('.fa-sun');
                if (isDark) { moon?.classList.add('hidden'); sun?.classList.remove('hidden'); }
                else { moon?.classList.remove('hidden'); sun?.classList.add('hidden'); }
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }

            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    setTheme(!document.documentElement.classList.contains('dark'));
                });
            }

            const savedTheme = localStorage.getItem('theme');
            setTheme(savedTheme === 'dark');

            // 2. RTL Toggle
            const rtlBtn = document.getElementById('rtl-toggle');
            function setRTL(isRTL) {
                document.documentElement.setAttribute('dir', isRTL ? 'rtl' : 'ltr');
                localStorage.setItem('dir', isRTL ? 'rtl' : 'ltr');
            }

            const savedDir = localStorage.getItem('dir');
            setRTL(savedDir === 'rtl');

            if (rtlBtn) {
                rtlBtn.addEventListener('click', () => {
                    setRTL(document.documentElement.getAttribute('dir') !== 'rtl');
                });
            }

            // 3. Password Toggle
            document.querySelectorAll('.toggle-password').forEach(button => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('data-target');
                    const input = document.getElementById(targetId);
                    if (input) {
                        const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                        input.setAttribute('type', type);
                        const icon = this.querySelector('i');
                        if (icon) {
                            icon.classList.toggle('fa-eye-slash');
                            icon.classList.toggle('fa-eye');
                        }
                    }
                });
            });

            // 4. Social signup placeholders
            document.getElementById('googleSignupBtn').addEventListener('click', function() {
                alert('Sign up with Google — coming soon. For now, use the demo form.');
            });
            document.getElementById('appleSignupBtn').addEventListener('click', function() {
                alert('Sign up with Apple — coming soon. For now, use the demo form.');
            });

            // 5. Demo signup — validate then redirect to login
            document.getElementById('signupForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const password = document.getElementById('signup-password').value;
                const confirm = document.getElementById('signup-confirm-password').value;
                if (password !== confirm) {
                    alert('Passwords do not match. Please try again.');
                    return;
                }
                if (password.length < 6) {
                    alert('Password must be at least 6 characters long.');
                    return;
                }
                if (!document.getElementById('terms').checked) {
                    alert('Please agree to the Terms of Service and Privacy Policy.');
                    return;
                }
                alert('Account created successfully! Please sign in to continue.');
                window.location.href = 'login.html';
            });

            // 6. Terms & Privacy links
            document.getElementById('termsLink').addEventListener('click', function(e) {
                e.preventDefault();
                alert('Terms of Service — coming soon.');
            });
            document.getElementById('privacyLink').addEventListener('click', function(e) {
                e.preventDefault();
                alert('Privacy Policy — coming soon.');
            });
        });
    </script>

</body>
</html>
