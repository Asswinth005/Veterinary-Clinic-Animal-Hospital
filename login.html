<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth" data-theme="teal-coral">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover">
    <title>Client Login · PawCare Veterinary Clinic</title>

    <!-- Favicon suite (paw icon) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='22' r='6' fill='%230d9488'/%3E%3Ccircle cx='8' cy='14' r='4' fill='%230d9488'/%3E%3Ccircle cx='24' cy='14' r='4' fill='%230d9488'/%3E%3Ccircle cx='12' cy='8' r='3.5' fill='%230d9488'/%3E%3Ccircle cx='20' cy='8' r='3.5' fill='%230d9488'/%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='22' r='6' fill='%230d9488'/%3E%3Ccircle cx='8' cy='14' r='4' fill='%230d9488'/%3E%3Ccircle cx='24' cy='14' r='4' fill='%230d9488'/%3E%3Ccircle cx='12' cy='8' r='3.5' fill='%230d9488'/%3E%3Ccircle cx='20' cy='8' r='3.5' fill='%230d9488'/%3E%3C/svg%3E" />

    <!-- Tailwind CSS -->
    <script src="tailwind.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'teal-brand': 'var(--color-primary)',
                        'teal-light': 'var(--color-primary-light)',
                        'teal-dark': 'var(--color-primary-dark)',
                        'teal-bright': 'var(--color-primary-bright)',
                        'coral-accent': 'var(--color-accent)',
                        'bg-sand': 'var(--color-bg-warm)',
                        'ink-charcoal': 'var(--color-text-dark)',
                        'dark-bg': '#1a1f2e',
                        'dark-card': '#232a3d',
                        'dark-surface': '#2d3548',
                    },
                    fontFamily: {
                        'sans': ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        'display': ['Quicksand', 'sans-serif'],
                        'body': ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out',
                        'float-slow': 'floatSlow 6s ease-in-out infinite',
                        'slide-up': 'slideUp 0.5s ease-out',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(12px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        floatSlow: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-6px)' } },
                        slideUp: { '0%': { transform: 'translateY(30px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                    }
                }
            }
        }
    </script>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        :root, [data-theme="teal-coral"] {
            --color-primary: #0d9488;
            --color-primary-light: #99f6e4;
            --color-primary-dark: #0f766e;
            --color-primary-bright: #2dd4bf;
            --color-accent: #ff5a36;
            --color-bg-warm: #fefdfb;
            --color-text-dark: #343a45;
            --color-rgb-primary: 13, 148, 136;
            --color-rgb-bright: 45, 212, 191;
            --color-rgb-coral: 255, 90, 54;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--color-bg-warm);
            color: var(--color-text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            font-family: 'Inter', system-ui, sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .dark body {
            background-color: #1a1f2e;
            color: #eceef2;
        }

        .dark .text-ink-charcoal { color: #eceef2; }
        .dark input, .dark select, .dark textarea { color: #FFFFFF !important; }

        .teal-gradient-text {
            background: linear-gradient(135deg, #5eead4 0%, #14b8a6 50%, #0f766e 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Theme toggles — top-right */
        .theme-toggle-wrapper {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            display: flex;
            gap: 8px;
        }

        [dir="rtl"] .theme-toggle-wrapper {
            right: auto;
            left: 16px;
        }

        .toggle-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(13, 148, 136, 0.1);
            color: #0d9488;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: bold;
        }

        .dark .toggle-btn {
            background: rgba(45, 212, 191, 0.15);
            color: #2dd4bf;
        }

        .toggle-btn:hover {
            transform: scale(1.1);
            background: rgba(13, 148, 136, 0.2);
            color: #0d9488;
        }

        .dark .toggle-btn:hover {
            transform: scale(1.1);
            background: rgba(45, 212, 191, 0.25);
            color: #2dd4bf;
        }

        /* Login Card */
        .login-card {
            background: #FFFFFF;
            border-radius: 32px;
            padding: 2.5rem 2.2rem 2.2rem;
            box-shadow: 0 25px 50px rgba(var(--color-rgb-primary), 0.10);
            border: 1px solid rgba(var(--color-rgb-primary), 0.15);
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .dark .login-card {
            background: #232a3d;
            border-color: rgba(var(--color-rgb-bright), 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        /* Input styling */
        .login-input {
            width: 100%;
            padding: 0.9rem 1.2rem 0.9rem 3rem;
            border-radius: 16px;
            border: 1.5px solid rgba(var(--color-rgb-primary), 0.15);
            background: #FFFFFF;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            color: var(--color-text-dark);
            font-family: 'Inter', sans-serif;
        }

        .dark .login-input {
            background: #1a1f2e;
            border-color: rgba(var(--color-rgb-bright), 0.2);
            color: #eceef2;
        }

        .login-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(var(--color-rgb-primary), 0.15);
        }

        .dark .login-input:focus {
            border-color: var(--color-primary-bright);
            box-shadow: 0 0 0 4px rgba(var(--color-rgb-bright), 0.12);
        }

        .login-input::placeholder {
            color: rgba(52, 58, 69, 0.4);
        }
        .dark .login-input::placeholder {
            color: rgba(236, 238, 242, 0.3);
        }

        /* Password wrapper */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper .login-input {
            padding-right: 3rem;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--color-primary);
            font-size: 1rem;
            transition: color 0.2s;
            background: transparent;
            border: none;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dark .toggle-password {
            color: var(--color-primary-bright);
        }

        .toggle-password:hover {
            color: var(--color-primary-dark);
        }

        [dir="rtl"] .toggle-password {
            right: auto;
            left: 1rem;
        }

        [dir="rtl"] .password-wrapper .login-input {
            padding-right: 1.2rem;
            padding-left: 3rem;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }

        /* Primary button */
        .btn-teal {
            background: var(--color-primary);
            color: #FFFFFF;
            font-weight: 700;
            padding: 0.9rem 1.8rem;
            border-radius: 9999px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            box-shadow: 0 4px 15px rgba(var(--color-rgb-primary), 0.3);
            letter-spacing: 0.3px;
        }

        .dark .btn-teal {
            background: var(--color-primary-bright);
            color: #1a1f2e;
            box-shadow: 0 4px 15px rgba(var(--color-rgb-bright), 0.3);
        }

        .btn-teal:hover {
            transform: translateY(-2px);
            background: var(--color-primary-dark);
            color: #FFFFFF;
            box-shadow: 0 10px 25px rgba(var(--color-rgb-primary), 0.4);
        }

        .dark .btn-teal:hover {
            background: var(--color-primary);
            color: #FFFFFF;
            box-shadow: 0 10px 25px rgba(var(--color-rgb-bright), 0.4);
        }

        /* Social login buttons */
        .social-btn {
            flex: 1;
            padding: 0.8rem 0.5rem;
            border-radius: 9999px;
            border: 1.5px solid rgba(var(--color-rgb-primary), 0.15);
            background: #FFFFFF;
            color: var(--color-text-dark);
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            gap: 0.5rem;
            white-space: nowrap;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
        }

        .dark .social-btn {
            background: #1a1f2e;
            border-color: rgba(var(--color-rgb-bright), 0.2);
            color: #eceef2;
        }

        .social-btn:hover {
            background: var(--color-bg-warm);
            border-color: var(--color-primary);
            transform: translateY(-2px);
        }

        .dark .social-btn:hover {
            background: rgba(var(--color-rgb-bright), 0.08);
            border-color: var(--color-primary-bright);
        }

        .social-btn i {
            font-size: 1.1rem;
            color: var(--color-primary);
        }

        .dark .social-btn i {
            color: var(--color-primary-bright);
        }

        /* Logo container */
        .logo-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .brand-logo {
            background: var(--color-primary);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(var(--color-rgb-primary), 0.25);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .brand-logo:hover {
            transform: scale(1.05);
        }

        .dark .brand-logo {
            background: var(--color-primary-bright);
        }

        .brand-logo svg {
            width: 28px;
            height: 28px;
        }

        .welcome-title {
            font-family: 'Quicksand', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-text-dark);
            margin-top: 1.5rem;
            margin-bottom: 0.25rem;
            text-align: center;
            line-height: 1.2;
        }

        .dark .welcome-title {
            color: #eceef2;
        }

        .welcome-subtitle {
            font-size: 0.9rem;
            color: var(--color-text-dark);
            text-align: center;
            margin-bottom: 0.5rem;
            font-weight: 400;
            opacity: 0.7;
        }

        .dark .welcome-subtitle {
            color: #eceef2;
        }

        /* RTL adjustments */
        [dir="rtl"] .login-input {
            padding: 0.9rem 3rem 0.9rem 1.2rem;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }

        [dir="rtl"] .fa-sign-in-alt {
            transform: scaleX(-1);
        }

        /* Responsive */
        @media (max-height: 650px) {
            .login-card { padding: 1.2rem 1.5rem; transform: scale(0.92); transform-origin: center; }
            .logo-center { margin-bottom: 0.5rem; }
            .welcome-title { font-size: 1.5rem; margin-top: 0.5rem; }
            .welcome-subtitle { font-size: 0.8rem; margin-bottom: 0.5rem; }
            .login-input { padding: 0.65rem 1rem 0.65rem 2.5rem; font-size: 0.85rem; }
            .btn-teal { padding: 0.65rem 1.2rem; font-size: 0.9rem; }
            .brand-logo { width: 38px; height: 38px; }
            .brand-logo svg { width: 22px; height: 22px; }
            .theme-toggle-wrapper { top: 8px; right: 8px; }
            .toggle-btn { width: 34px; height: 34px; font-size: 0.8rem; }
        }

        @media (max-width: 380px) {
            .login-card { padding: 1.5rem 1.2rem; border-radius: 24px; }
            .welcome-title { font-size: 1.5rem; }
            .login-input { padding: 0.7rem 1rem 0.7rem 2.8rem; font-size: 0.85rem; }
        }

        @media (max-width: 480px) {
            .theme-toggle-wrapper { top: 12px; right: 12px; }
            [dir="rtl"] .theme-toggle-wrapper { left: 12px; right: auto; }
        }

        .container-tight {
            max-width: 480px;
            width: 100%;
            padding: 0 1.5rem;
        }

        .custom-checkbox {
            accent-color: var(--color-primary);
        }

        .dark .custom-checkbox {
            accent-color: var(--color-primary-bright);
        }

        a {
            transition: all 0.2s ease;
        }

        /* Background decorative glow */
        .bg-glow {
            position: fixed;
            top: -30%;
            right: -20%;
            width: 60%;
            height: 80%;
            background: radial-gradient(circle, rgba(var(--color-rgb-primary), 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .dark .bg-glow {
            background: radial-gradient(circle, rgba(var(--color-rgb-bright), 0.04) 0%, transparent 70%);
        }

        .bg-glow-left {
            position: fixed;
            bottom: -30%;
            left: -20%;
            width: 60%;
            height: 80%;
            background: radial-gradient(circle, rgba(var(--color-rgb-primary), 0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .dark .bg-glow-left {
            background: radial-gradient(circle, rgba(var(--color-rgb-bright), 0.03) 0%, transparent 70%);
        }

        /* Floating paw decoration */
        .paw-deco {
            position: fixed;
            opacity: 0.04;
            font-size: 8rem;
            pointer-events: none;
            z-index: 0;
        }
        .dark .paw-deco { opacity: 0.03; }
    </style>
</head>

<body>

    <!-- Background Glows -->
    <div class="bg-glow"></div>
    <div class="bg-glow-left"></div>

    <!-- Floating paw decorations -->
    <div class="paw-deco" style="top: 10%; left: 5%;">🐾</div>
    <div class="paw-deco" style="bottom: 8%; right: 6%; font-size: 6rem;">🐾</div>

    <!-- ===== THEME TOGGLES - TOP-RIGHT ===== -->
    <div class="theme-toggle-wrapper">
        <button id="theme-toggle" class="toggle-btn" title="Dark / Light">
          <i class="fas fa-moon dark:hidden text-sm"></i>
          <i class="fas fa-sun hidden dark:inline text-sm"></i>
        </button>
        <button id="rtl-toggle" class="toggle-btn" title="RTL / LTR">
          &#8644;
        </button>
    </div>

    <!-- ===== LOGIN CARD ===== -->
    <div class="container-tight relative z-10">
        <div class="login-card animate-fade-in">

            <!-- ===== LOGO - CENTERED ===== -->
            <div class="logo-center">
                <a href="index.html" class="flex items-center gap-3 group shrink-0">
                    <div class="brand-logo" style="background-color: #0d9488 !important;">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
                            <circle cx="18" cy="22" r="5" fill="white" opacity="0.95"/>
                            <circle cx="10" cy="15" r="3.5" fill="white" opacity="0.95"/>
                            <circle cx="26" cy="15" r="3.5" fill="white" opacity="0.95"/>
                            <circle cx="14" cy="9" r="3" fill="white" opacity="0.95"/>
                            <circle cx="22" cy="9" r="3" fill="white" opacity="0.95"/>
                        </svg>
                    </div>
                    <span class="flex flex-col items-start leading-tight">
                        <span class="text-2xl font-display font-bold tracking-tight text-ink-charcoal dark:text-white">PawCare</span>
                        <span class="text-[10px] font-bold tracking-[0.15em] uppercase -mt-0.5" style="color: #ff5a36 !important;">Veterinary Clinic</span>
                    </span>
                </a>

                <h1 class="welcome-title">Welcome Back</h1>
                <p class="welcome-subtitle">Sign in to manage appointments, vaccination records &amp; medical history</p>
            </div>

            <!-- ===== LOGIN FORM ===== -->
            <form id="loginForm" class="space-y-5" action="client.html" method="GET">

                <!-- Email field -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-teal-brand input-icon">
                        <i class="fas fa-envelope w-5 text-sm"></i>
                    </span>
                    <input type="email" name="email" id="login-email" placeholder="Email address" required
                        class="login-input text-sm md:text-base">
                </div>

                <!-- Password field with eye icon -->
                <div class="password-wrapper">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-teal-brand input-icon">
                        <i class="fas fa-lock w-5 text-sm"></i>
                    </span>
                    <input type="password" id="login-password" name="password" placeholder="Password" required
                        class="login-input text-sm md:text-base">
                    <button type="button" class="toggle-password" data-target="login-password"
                        aria-label="Show password">
                        <i class="far fa-eye-slash"></i>
                    </button>
                </div>

                <!-- Remember + Forgot -->
                <div class="flex items-center justify-between text-xs md:text-sm">
                    <label class="flex items-center space-x-2 rtl:space-x-reverse cursor-pointer text-ink-charcoal dark:text-gray-300">
                        <input type="checkbox" class="rounded border-gray-300 dark:border-gray-600 custom-checkbox" checked>
                        <span class="ml-1 rtl:mr-1">Remember me</span>
                    </label>
                    <a href="#" id="forgotPasswordLink"
                        class="text-ink-charcoal dark:text-gray-300 hover:text-teal-brand font-semibold transition hover:underline">
                        Forgot password?
                    </a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-teal mt-2">
                    Sign In <i class="fas fa-sign-in-alt ml-2"></i>
                </button>

                <!-- Divider -->
                <div class="relative my-4">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-teal-brand/15 dark:border-teal-bright/15"></div>
                    </div>
                    <div class="relative justify-center flex text-xs">
                        <span class="bg-white dark:bg-[#232a3d] px-4 py-0.5 text-ink-charcoal dark:text-gray-300 rounded-full font-semibold">
                            or continue with
                        </span>
                    </div>
                </div>

            </form>

            <!-- ===== SOCIAL LOGIN BUTTONS ===== -->
            <div class="mt-4">
                <div class="grid grid-cols-2 gap-3">
                    <button class="social-btn" onclick="socialLogin('google')">
                        <i class="fab fa-google text-base"></i>
                        <span>Google</span>
                    </button>
                    <button class="social-btn" onclick="socialLogin('apple')">
                        <i class="fab fa-apple text-base"></i>
                        <span>Apple</span>
                    </button>
                </div>
            </div>

            <!-- ===== "NOT A MEMBER? SIGN UP" LINK ===== -->
            <div class="text-center mt-6 pt-4 border-t border-dashed border-teal-brand/15 dark:border-teal-bright/15">
                <p class="text-sm md:text-base font-semibold text-ink-charcoal dark:text-gray-300">
                    New to PawCare?
                    <a href="signup.html" class="text-teal-brand dark:text-teal-bright font-bold transition ml-1 rtl:mr-1 hover:underline">
                        Create Account
                    </a>
                </p>
            </div>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Theme Toggle
            const themeBtn = document.getElementById('theme-toggle');
            function setTheme(isDark) {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                const moon = themeBtn?.querySelector('.fa-moon');
                const sun = themeBtn?.querySelector('.fa-sun');
                if (isDark) { moon?.classList.add('hidden'); sun?.classList.remove('hidden'); }
                else { moon?.classList.remove('hidden'); sun?.classList.add('hidden'); }
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }

            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    setTheme(!document.documentElement.classList.contains('dark'));
                });
            }

            const savedTheme = localStorage.getItem('theme');
            setTheme(savedTheme === 'dark');

            // 2. RTL Toggle
            const rtlBtn = document.getElementById('rtl-toggle');
            function setRTL(isRTL) {
                document.documentElement.setAttribute('dir', isRTL ? 'rtl' : 'ltr');
                localStorage.setItem('dir', isRTL ? 'rtl' : 'ltr');
            }

            const savedDir = localStorage.getItem('dir');
            setRTL(savedDir === 'rtl');

            if (rtlBtn) {
                rtlBtn.addEventListener('click', () => {
                    setRTL(document.documentElement.getAttribute('dir') !== 'rtl');
                });
            }

            // 3. Password Toggle
            document.querySelectorAll('.toggle-password').forEach(button => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('data-target');
                    const input = document.getElementById(targetId);
                    if (input) {
                        const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                        input.setAttribute('type', type);
                        const icon = this.querySelector('i');
                        if (icon) {
                            icon.classList.toggle('fa-eye-slash');
                            icon.classList.toggle('fa-eye');
                        }
                    }
                });
            });

            // 4. Social login placeholder
            window.socialLogin = function(provider) {
                alert(`Sign in with ${provider} — coming soon. For now, use the demo form.`);
            };

            // 5. Demo login — redirect to client dashboard
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                window.location.href = 'client.html';
            });

            // 6. Forgot password link
            document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
                e.preventDefault();
                alert('Password reset link will be sent to your registered email.');
            });
        });
